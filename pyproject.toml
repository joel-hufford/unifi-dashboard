[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-dashboard"
version = "0.1.0"
description = "Touchscreen UniFi network status dashboard for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
unifi-dashboard = "unifi_dashboard.__main__:main"

[tool.setuptools.packages.find]
include = ["unifi_dashboard*"]

[tool.setuptools.package-data]
unifi_dashboard = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
