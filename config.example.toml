# Copy to config.toml (or ~/.config/unifi-dashboard/config.toml) and edit.
#
# Any of these settings can come from the environment instead, which the
# systemd unit reads from /etc/unifi-dashboard/secrets.env. The environment
# wins where both are set; an unset or empty variable is ignored.
#
#   UNIFI_DASHBOARD_API_KEY     unifi.api_key
#   UNIFI_DASHBOARD_USERNAME    unifi.username
#   UNIFI_DASHBOARD_PASSWORD    unifi.password
#   UNIFI_DASHBOARD_HOST        unifi.host
#   UNIFI_DASHBOARD_SITE        unifi.site
#   UNIFI_DASHBOARD_DEMO        demo mode (1/true/yes/on)
#
# Worth putting there: the credentials, and the console address if you would
# rather not have your internal addressing in a file you might share. If you
# do move a value out, leave a comment in its place - a config file that
# silently disagrees with what the service is using costs you an afternoon
# later.

# Seconds between controller polls. 10s keeps the load on the console trivial
# while still giving a 360-point graph over one hour.
poll_interval = 10.0

[unifi]
# Your console / controller. Use https:// and the LAN address.
host = "https://192.168.1.1"
site = "default"

# Preferred: an API key from Network -> Settings -> Control Plane -> Integrations.
# Requires UniFi Network 9.x on UniFi OS 4.1+.
api_key = ""

# Fallback for older controllers: a LOCAL-ONLY admin with read-only permissions
# and 2FA disabled. Leave api_key empty to use this.
username = ""
password = ""

# UniFi consoles ship a self-signed certificate, so verification is off by
# default. Set a path to the console's certificate to turn it back on.
verify_ssl = false
timeout = 10.0

[ping]
# WAN reachability probe, measured from the Pi itself.
target = "8.8.8.8"
count = 3          # packets per poll; more packets = finer packet-loss resolution
interval = 0.25    # seconds between packets (>= 0.2 without root)
timeout = 1.0      # seconds to wait for each reply

[dns]
# Resolved every poll, through the system resolver, to prove name resolution
# works and not merely that packets route. A working ICMP path with dead DNS
# is the most common "the internet is broken" state on a small network.
probe_host = "cloudflare.com"
timeout = 2.0

[alarm]
# What turns the screen's border amber, and what turns it red.
loss_pct_warning = 2.0
loss_pct_critical = 10.0
latency_ms_warning = 150.0
latency_ms_critical = 400.0
# Running on the backup WAN is not an outage, but on a metered cellular link
# it is something you want to notice the same day. Amber by default.
failover_is_critical = false

[public_ip]
# Look up the address the internet sees you as, so the panel can show both the
# address the local network handed you and what you are presenting outward.
# The gap between them is the NAT you are sitting behind - which is the thing
# nobody tells you when you plug into a venue-supplied line.
#
# This is an outbound request to a third party. It runs once per interval plus
# a lookup whenever the WAN address changes; set enabled = false for a panel
# that makes no external calls at all.
enabled = true
url = "https://api.ipify.org"
interval_minutes = 15.0
timeout = 5.0

[charts]
# Small-site WAN traffic is idle most of the time with rare bursts, which a
# linear axis scaled to the peak renders as a flat line on the baseline.
# "log" keeps ordinary traffic legible without clipping the peak; "linear" is
# truer to magnitude and fine on a consistently busy link.
throughput_scale = "log"
# Decades the log axis spans below its top. Three covers roughly 0.5-500 Mbps.
log_decades = 3.0

[ui]
# The theme the panel starts in: "dark" or "light". The on-screen toggle only
# changes the current session, so a stray touch corrects itself on the next
# refresh instead of leaving a wall panel in the wrong theme.
theme = "dark"

[server]
host = "127.0.0.1"  # 0.0.0.0 to reach the dashboard from other machines
port = 8787

[history]
window_minutes = 60      # default graph window
retention_minutes = 180  # how much history to keep on disk
db_path = "~/.local/share/unifi-dashboard/history.db"

[wlan]
# A client at or below this signal (dBm) counts as "weak".
weak_signal_dbm = -70
